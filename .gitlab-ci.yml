stages:
  - lint
  - test
  - build
  - docker

variables:
  GO_VERSION: "1.22"
  APP_NAME: "scaffold"
  IMAGE_REGISTRY: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.default_go:
  image: golang:$GO_VERSION
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .go/pkg/mod/
  before_script:
    - go env -w GOPATH=$CI_PROJECT_DIR/.go
    # lint/test：仅 deps；勿 make init（含 setup-migrate，无 DB 会失败）
    - make deps

lint:
  stage: lint
  extends: .default_go
  script:
    # before_script 把 GOPATH 指到项目内（为让模块缓存落到 cache 路径），副作用是
    # GOBIN 也变成 $CI_PROJECT_DIR/.go/bin —— 该目录不在 PATH 上，于是 `go install`
    # 装好的工具都找不到。这里把 GOBIN 钉回镜像自带路径。
    - go env -w GOBIN=/usr/local/bin
    - make setup-lint
    - make lint

# goctl / go-zero / templates 版本门禁（不含完整 make gen：镜像无 protoc）
scaffold-check:
  stage: lint
  extends: .default_go
  script:
    # 同上：否则 goctl 装到未在 PATH 上的 GOBIN 目录，check-goctl 必然失败
    - go env -w GOBIN=/usr/local/bin
    - go install github.com/zeromicro/go-zero/tools/goctl@v1.7.3
    - make check-goctl check-go-zero check-templates

test:
  stage: test
  extends: .default_go
  variables:
    APP_ENV: test
  script:
    - make test

# 覆盖率拆 job；失败不阻断主干
test-coverage:
  stage: test
  extends: .default_go
  variables:
    APP_ENV: test
  needs: [test]
  allow_failure: true
  script:
    - make test-coverage
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 7 days

build:
  stage: build
  extends: .default_go
  script:
    - make build
  artifacts:
    paths:
      - output/
    expire_in: 3 days

docker:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make docker-build IMAGE=$IMAGE_REGISTRY/$APP_NAME:$IMAGE_TAG
    - docker push $IMAGE_REGISTRY/$APP_NAME:$IMAGE_TAG
