# 复制为 secret.yaml 后填入真实值（勿提交仓库）
# kubectl apply -f secret.yaml
#
# 启动 prod 必需项：
# - HEALTH_PROBE_TOKEN（外网/人工探 /health 用；Pod 内回环探针可不带 Header）
# Phase1 门闩（仅内网 Mode=require；禁止公网 Ingress；公网前须 Mode=sdk）：
# - AUTH_ALLOW_PHASE1_GATE=true
# - AUTH_PHASE1_ACK=I_UNDERSTAND_NOT_FOR_PUBLIC
# 启用 Etcd 热更时另须：ETCD_HOTRELOAD_TOKEN（及 TLS 或 ETCD_ALLOW_INSECURE）
apiVersion: v1
kind: Secret
metadata:
  name: scaffold-secrets
type: Opaque
stringData:
  DB_PASS: "CHANGE_ME"
  REDIS_USER: "scaffold_user"
  REDIS_PASS: "CHANGE_ME"
  # OSS：四项齐备再取消注释（Endpoint/Bucket 在 ConfigMap；仅填 AK 不会启用探活）
  # OSS_ACCESS_KEY_ID: "CHANGE_ME"
  # OSS_ACCESS_KEY_SECRET: "CHANGE_ME"
  # SLS：五项齐备再取消注释（Endpoint/Project/Logstore 可在 ConfigMap）
  # SLS_ACCESS_KEY_ID: "CHANGE_ME"
  # SLS_ACCESS_KEY_SECRET: "CHANGE_ME"
  # RocketMQ：VPC 免密可留空；否则填实例用户名/密码
  # MQ_ACCESS_KEY: "CHANGE_ME"
  # MQ_ACCESS_KEY_SECRET: "CHANGE_ME"
  HEALTH_PROBE_TOKEN: "CHANGE_ME_HEALTH_TOKEN"
  # 仅 Phase1 内网破窗时取消注释；禁止复制即默认打开；禁止公网 Ingress
  # AUTH_ALLOW_PHASE1_GATE: "true"
  # AUTH_PHASE1_ACK: "I_UNDERSTAND_NOT_FOR_PUBLIC"
  # ETCD_HOTRELOAD_TOKEN: "CHANGE_ME_HOTRELOAD"
  # DB_DSN_SQL: "postgres://scaffold:pass@CHANGE_ME.pg.rds.aliyuncs.com:5432/scaffold?sslmode=require"
  # REDIS_ALLOW_INSECURE: "true"
